services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: lightops-web:latest
    container_name: lightops-web
    ports:
      - '${WEB_PORT:-3005}:80'
    volumes:
      - ./deploy/downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - lightops-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      target: production
    image: lightops-api:latest
    container_name: lightops-api
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      TZ: ${TZ:-Asia/Shanghai}
      API_PORT: 3000
      ORDER_NO_TIME_ZONE: ${ORDER_NO_TIME_ZONE:-Asia/Shanghai}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lightops}
      DB_USER: ${DB_USER:-lightops}
      DB_PASSWORD: ${DB_PASSWORD:-lightops_dev_pwd}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      DB_SSL: ${DB_SSL:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_pwd}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_min_64_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_ORIGINS: ${APP_ORIGINS:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lightops-files}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lightops-net
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:3000/v1/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: lightops-postgres
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - work_mem=4MB
    expose:
      - '5432'
    environment:
      POSTGRES_DB: ${DB_NAME:-lightops}
      POSTGRES_USER: ${DB_USER:-lightops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lightops_dev_pwd}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lightops-net

  redis:
    image: redis:7-alpine
    container_name: lightops-redis
    expose:
      - '6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_pwd}
      TZ: ${TZ:-Asia/Shanghai}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_pwd} --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - lightops-net

  minio:
    image: minio/minio:latest
    container_name: lightops-minio
    expose:
      - '9000'
      - '9001'
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lightops-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: lightops-redis-insight
    ports:
      - '${REDIS_INSIGHT_BIND:-127.0.0.1}:${REDIS_INSIGHT_PORT:-5540}:5540'
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - lightops-net
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  lightops-net:
    driver: bridge
