name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test toolbox core
        run: pnpm --filter @lightops/toolbox-core run test

      - name: Build toolbox core
        run: pnpm --filter @lightops/toolbox-core run build

      - name: Lint backend
        run: pnpm --filter backend run lint

      - name: Test backend
        run: pnpm --filter backend run test

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Test web
        run: pnpm --filter web run test

      - name: Build web
        run: pnpm --filter web run build

      - name: Typecheck mobile app
        run: pnpm --filter LightOps run test

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test web e2e
        run: pnpm --filter web run test:e2e

  postgres-e2e:
    name: Backend PostgreSQL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lightops_e2e
          POSTGRES_USER: lightops_e2e
          POSTGRES_PASSWORD: lightops_e2e_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lightops_e2e -d lightops_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend app e2e on PostgreSQL
        env:
          E2E_DB_TYPE: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lightops_e2e
          DB_USER: lightops_e2e
          DB_PASSWORD: lightops_e2e_pwd
          DB_SYNCHRONIZE: 'true'
          DB_MIGRATIONS_RUN: 'false'
          DB_LOGGING: 'false'
          JWT_SECRET: test_jwt_secret_for_lightops_ci_postgres_e2e_at_least_32_chars
        run: pnpm --filter backend run test -- app.e2e.spec.ts --runInBand
