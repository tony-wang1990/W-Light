name: Build Client Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'deploy/downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Generate unique client version
        run: node scripts/prepare-client-version.mjs

      - name: Build and publish Android package metadata
        run: bash scripts/android-release.sh --publish-web --skip-checks

      - name: Upload Android download-center files
        uses: actions/upload-artifact@v4
        with:
          name: android-downloads
          path: |
            deploy/downloads/w-light-latest.apk
            deploy/downloads/w-light-latest.apk.sha256
            deploy/downloads/w-light-android.json
          if-no-files-found: error

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Generate unique client version
        shell: pwsh
        run: node scripts/prepare-client-version.mjs

      - name: Build and publish Windows package metadata
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/desktop-release.ps1 -Target win -PublishWeb

      - name: Upload Windows download-center files
        uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: |
            deploy/downloads/W-Light-Setup-latest.exe
            deploy/downloads/W-Light-Setup-latest.exe.sha256
            deploy/downloads/w-light-desktop.json
          if-no-files-found: error

  publish-download-center:
    name: Publish packages to download center
    if: github.ref == 'refs/heads/main'
    needs:
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built package files
        uses: actions/download-artifact@v4
        with:
          path: deploy/downloads
          merge-multiple: true

      - name: Verify download-center files
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm downloads:verify -- --strict

      - name: Commit updated packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/downloads
          if git diff --cached --quiet; then
            echo "No package changes to publish."
            exit 0
          fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          git commit -m "chore: publish client packages for ${SHORT_SHA} [skip ci]"
          git push

  github-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built package files
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/w-light-latest.apk
            release-files/W-Light-Setup-latest.exe
          draft: false
          prerelease: false
          generate_release_notes: true
