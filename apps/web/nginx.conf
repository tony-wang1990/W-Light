server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 120m;

    location /v1/sse/ {
        proxy_pass http://api:3000/v1/sse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /v1/ {
        proxy_pass http://api:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs/ {
        proxy_pass http://api:3000/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /downloads is a React admin route. Keep both forms on the SPA shell,
    # while child paths remain reserved for APK/EXE/checksum artifacts.
    location = /downloads {
        try_files /index.html =404;
    }

    location = /downloads/ {
        try_files /index.html =404;
    }

    location ^~ /downloads/ {
        autoindex off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        # Do not probe physical directories here. A directory sharing a name
        # with an SPA route would otherwise trigger a trailing-slash redirect.
        try_files $uri /index.html;
    }
}
